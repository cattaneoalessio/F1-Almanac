<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google AdSense: DEVE stare nel <head> di OGNI pagina del sito.
         Il sito è una single-page app: tutte le pagine (anche quelle che si
         creeranno in futuro) escono da questo unico index.html, quindi basta
         questo. Se un giorno si aggiunge una pagina HTML separata (es. in
         public/), va incollato lo stesso snippet anche lì: lo script
         scripts/verifica-adsense.mjs, eseguito a ogni build, fa fallire la
         pubblicazione se manca. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8142312526608548"
      crossorigin="anonymous"
    ></script>
    <title>Monoposto.ai — L'almanacco della Formula 1</title>
    <meta name="description" content="Monoposto.ai: risultati, classifiche, piloti, scuderie e circuiti della Formula 1 dal 1950 a oggi, con analisi di telemetria dei Gran Premi." />
    <!-- Favicon: la "M" del logo Monoposto.ai (file sorgente in
         public/branding/), ritagliata stretta sul cuore del simbolo per
         restare leggibile alle dimensioni minuscole di un'icona di scheda —
         la versione larga con lo strascico di quadratini decorativi, bella
         a dimensione piena, diventava un'ombra confusa sotto i 48px. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Font coerenti con le linee guida grafiche del progetto (aggiornate
         2026-09-21, redesign fotografico): Big Shoulders Display per titoli
         e numeri in stile "cronometro", IBM Plex Sans per i testi. Share Tech
         Mono resta caricato: serve ancora ai tempi/tabellari del live timing
         (var(--font-mono)), invariato dal redesign. Caricati qui una sola
         volta per tutta l'app. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
